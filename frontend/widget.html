<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>دستیار لانچو</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="./assets/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./widget.css">
  <script type="module" src="./widget.js?v=2"></script>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5"/><path d="M5 20v-1a7 7 0 0 1 14 0v1H5Z"/></symbol>
      <symbol id="bot-avatar" viewBox="0 0 24 24"><path d="M12 3v4"/><circle cx="12" cy="2.5" r="1.5" fill="currentColor" stroke="none"/><rect x="3" y="7" width="18" height="14" rx="5" fill="currentColor" stroke="none"/><rect x="6" y="10" width="12" height="8" rx="3" fill="var(--bot-screen)" stroke="none"/><circle cx="9" cy="14" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.4" fill="currentColor" stroke="none"/></symbol>
    </defs>
  </svg>
  <section class="chat" role="region" aria-labelledby="chat-title">
    <header class="header">
      <span class="wordmark" lang="en">LAUNCHO</span>
      <span class="header-divider" aria-hidden="true"></span>
      <h1 id="chat-title">دستیار لانچو</h1>
      <button id="close" class="icon-button" type="button" aria-label="بستن گفتگو"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </header>
    <main id="scroll-area" class="scroll-area" tabindex="0" aria-label="محتوای گفتگو">
      <section id="welcome" class="welcome message-row role-assistant" aria-labelledby="welcome-title">
        <span class="avatar robot-halo" aria-hidden="true"><svg class="robot"><use href="#bot-avatar"/></svg></span>
        <h2 id="welcome-title" class="greeting">سلام! چطور کمکت کنم؟</h2>
        <p id="welcome-description" class="sr-only">درباره ساخت فروشگاه و امکانات لانچو بپرس.</p>
      </section>
      <div id="messages" class="messages" role="log" aria-label="پیام‌های گفتگو" aria-live="polite" aria-relevant="additions"></div>
      <div id="waiting" class="waiting" role="status" hidden><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>در حال نوشتن…</span></div>
      <section id="workflow" aria-label="مراحل ساخت فروشگاه" hidden></section>
      <button id="review-button" type="button" hidden>مرور خلاصه و تأیید</button>
      <section id="session-review" class="flow-card" aria-labelledby="review-title" hidden>
        <h2 id="review-title">مرور اطلاعات</h2>
        <div id="review-summary"></div>
        <p id="review-notice"></p>
        <button id="confirm" class="primary" type="button" disabled>تأیید و ساخت پیش‌نویس</button>
      </section>
    </main>
    <nav class="starters" aria-label="پیشنهادهای گفتگو">
      <button class="primary-starter" type="button" data-question="برای ساخت فروشگاه با لانچو از کجا شروع کنم؟">ساخت فروشگاه</button>
      <button type="button" data-question="لانچو چه امکاناتی دارد؟">امکانات</button>
      <button class="price-card" type="button" data-question="برای اطلاع از تعرفه‌های لانچو از کجا اقدام کنم؟">تعرفه‌ها</button>
    </nav>
    <footer class="composer">
      <div id="error" class="error" role="alert" hidden><span id="error-text"></span><button id="retry" type="button" hidden>تلاش مجدد</button></div>
      <form id="form" novalidate>
        <label class="sr-only" for="message">پیام شما</label>
        <div class="input-row"><button id="send" class="send" type="submit" aria-label="ارسال پیام" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 3.7 9.6c-.9.4-.9 1.2 0 1.5l6.4 2.1 2.2 6.5c.3.9 1.1.9 1.5 0L21 3Z"/><path d="m10.1 13.2 5.8-5.7"/></svg></button><textarea id="message" rows="1" placeholder="پیامت را بنویس…" aria-describedby="input-hint" spellcheck="false"></textarea></div>
        <p id="input-hint" class="sr-only">پاسخ‌ها با هوش مصنوعی تولید می‌شوند.</p>
      </form>
    </footer>
  </section>
</body>
</html>
